name: context_length
base: ../02b_char_transformer_modern.yaml
seeds: [1337]

common:
  train.batch_size: 32
  train.weight_decay: 0.1
  train.compile: false

runs:
  - name: lstm_64
    overrides:
      model.arch: lstm
      model.n_layers: 2
      model.dim: 256
      train.seq_len: 64
      train.max_steps: 4800
      train.lr: 2e-3
      train.weight_decay: 0.0

  - name: lstm_128
    overrides:
      model.arch: lstm
      model.n_layers: 2
      model.dim: 256
      train.seq_len: 128
      train.max_steps: 2400
      train.lr: 2e-3
      train.weight_decay: 0.0

  - name: lstm_256
    overrides:
      model.arch: lstm
      model.n_layers: 2
      model.dim: 256
      train.seq_len: 256
      train.max_steps: 1200
      train.lr: 2e-3
      train.weight_decay: 0.0

  - name: lstm_512
    overrides:
      model.arch: lstm
      model.n_layers: 2
      model.dim: 256
      train.seq_len: 512
      train.max_steps: 600
      train.lr: 2e-3
      train.weight_decay: 0.0

  - name: gpt_64
    overrides:
      train.seq_len: 64
      train.max_steps: 4800

  - name: gpt_128
    overrides:
      train.seq_len: 128
      train.max_steps: 2400

  - name: gpt_256
    overrides:
      train.seq_len: 256
      train.max_steps: 1200

  - name: gpt_512
    overrides:
      train.seq_len: 512
      train.max_steps: 600
